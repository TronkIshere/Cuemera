name: cuemera
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI / Flutter
  cupertino_icons: ^1.0.8

  # Camera / Image
  camera: ^0.11.0+2
  image: ^4.2.0
  image_picker: ^1.1.2
  gal: ^2.3.0
  palette_generator: ^0.3.3+3

  # Google ML Kit — POSE / VISION

  # Main pose estimation
  google_mlkit_pose_detection: ^0.15.0

  # Face landmarks / head verification
  google_mlkit_face_detection: ^0.14.0

  # Person/background segmentation
  google_mlkit_selfie_segmentation: ^0.11.0

  # Shared ML Kit infrastructure
  google_mlkit_commons: ^0.12.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5

  # Permissions
  permission_handler: ^11.3.1

  # Text To Speech / Audio
  flutter_tts: ^4.2.0
  audioplayers: ^6.0.0
  sherpa_onnx: ^1.12.11

  # On-device LLM / AI
  flutter_gemma: ^1.5.2
  flutter_gemma_mediapipe: ^1.0.0

  # App / Build
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/vits-en/
